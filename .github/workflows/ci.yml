name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: Backend · ruff, mypy, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Stockfish (engine tests)
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy app scripts
      - name: pytest
        run: uv run pytest -q
        env:
          STOCKFISH_PATH: /usr/games/stockfish

  e2e:
    name: End-to-end · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - name: Install dependencies
        run: |
          uv python install 3.12
          (cd backend && uv sync --locked)
          (cd frontend && npm ci && npx playwright install --with-deps chromium)
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
        env:
          CI: "true"
          E2E_BACKEND: "1"
          STOCKFISH_PATH: /usr/games/stockfish
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t blindfold-chess-api backend
      - name: Smoke test
        run: |
          docker run -d --name api -p 7860:7860 blindfold-chess-api
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7860/api/health && exit 0; sleep 2; done
          docker logs api; exit 1
